repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
        # The hook ships with types_or: [python, pyi, jupyter], but CI runs
        # `ruff format --check .` over the whole tree -- and ruff formats
        # Python code blocks inside markdown. Without `markdown` here, a
        # docs-only commit is invisible to this hook and still fails CI:
        # that is exactly how specs/system_test.md broke main for 10 days
        # (2026-08-17 .. 2026-08-27). Keep this list matching what CI checks.
        types_or: [python, pyi, jupyter, markdown]
