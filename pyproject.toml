[project]
name = "aiform"
version = "0.1.0"
description = "AI-driven infrastructure-as-code CLI"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    # 0.77 is the binding floor: _anthropic_call passes output_config on
    # every structured call, which lands in 0.77.0. (client.models, which
    # verify_api_key probes, only needs 0.41 -- the lower of the two would
    # let init report a green key and every plan create then die on an
    # unexpected-keyword TypeError.)
    # The <1 cap is load-bearing, not caution. anthropic 1.x swapped its
    # HTTP stack from httpx to httpx2, so DefaultHttpxClient subclasses
    # httpx2.Client there. tests/test_llm.py proves the #97 redirect leak is
    # closed by injecting an httpx.MockTransport into that client; against a
    # 1.x client the transport is foreign, the request fails as an
    # APIConnectionError, and the test passes identically with
    # follow_redirects=True -- a silent false green on the one test that
    # exists to stop a token leak recurring. Lift this only together with
    # porting that test to whichever stack the SDK then uses.
    "anthropic>=0.77,<1",
]

[project.scripts]
aiform = "aiform.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.16",
    "pre-commit>=4.0",
    # tests/test_llm.py drives verify_api_key's redirect refusal through an
    # httpx.MockTransport. Declared explicitly rather than leaned on as a
    # transitive of anthropic: it is one only while the <1 cap above holds,
    # and an undeclared import would break the suite the moment that changes.
    # It must stay the same stack anthropic uses, or the mock is foreign --
    # see the cap's comment.
    "httpx>=0.28",
]

[tool.pytest.ini_options]
markers = [
    "system: live end-to-end tests against real DigitalOcean/Anthropic APIs (specs/system_test.md); excluded by default, run explicitly with `pytest -m system tests/system/`",
]
addopts = "-m 'not system'"
# Some test modules import `tests.*` (tests/test_conftest.py) and some import
# `scripts.*` (tests/test_run_system_tests.py); neither package is installed by
# [tool.setuptools.packages.find]. Bare `pytest` -- what CI runs -- does not put
# the rootdir on sys.path, unlike `python -m pytest`, so both fail without this.
# Note this means adding tests/__init__.py alone would NOT be a sufficient fix.
pythonpath = ["."]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aiform*", "drivers*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# UP042: str+Enum -> enum.StrEnum is a semantic base-class change (ruff
# marks it unsafe), not a formatting one -- deliberately not applied to
# PlanAction here; revisit as its own explicit decision if wanted.
ignore = ["UP042"]

[tool.ruff.lint.isort]
# `drivers` isn't the project's own package name (`aiform`), so ruff can't
# auto-detect it as first-party -- without this it sorts into the
# third-party group alongside pytest/anthropic instead of with aiform.
known-first-party = ["aiform", "drivers"]
