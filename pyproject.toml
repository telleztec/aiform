[project]
name = "aiform"
version = "0.1.0"
description = "AI-driven infrastructure-as-code CLI"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.16",
    "pre-commit>=4.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aiform*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# UP042: str+Enum -> enum.StrEnum is a semantic base-class change (ruff
# marks it unsafe), not a formatting one -- deliberately not applied to
# PlanAction here; revisit as its own explicit decision if wanted.
ignore = ["UP042"]
